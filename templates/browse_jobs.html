<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #1D0936;
            color: white;
            animation: slideUp 0.8s ease-out;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 40px;
            background: transparent;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            padding: 40px;
        }

        .search-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 15px;
            border-radius: 15px;
            -webkit-backdrop-filter: blur();
            backdrop-filter: blur(10px);
        }

        .search-bar input,
        .search-bar select {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            width: 220px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: #94a3b8;
        }

        .search-bar input:focus,
        .search-bar select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 10px #6366f1;
        }

        .search-bar button {
            padding: 12px 22px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            cursor: pointer;
        }

        .search-wrapper {
            position: relative;
        }

        .suggestions {
            position: absolute;
            top: 110%;
            left: 0;
            width: 100%;
            background: rgba(20, 10, 40, 0.95);
            border-radius: 10px;
            overflow: hidden;
            display: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            animation: fadeSlide 0.25s ease;
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
        }

        .suggestion-item:hover {
            background: rgba(99, 102, 241, 0.3);
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .job-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .job-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .job-title {
            color: #8b5cf6;
            font-size: 18px;
        }

        .apply-btn {
            margin-top: 10px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            cursor: pointer;
        }

        .apply-btn[disabled] {
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
    <style>
        @keyframes slideUp {
            from {
                transform: translateY(60px);
            }
            to {
                transform: translateY(0);
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
 
    <div class="navbar">
        <div>AI Jobs</div>
        <div>
            <a href="/dashboard">Home</a>
            <a href="/jobs" aria-current="page">Browse Jobs</a>
            <a href="/dashboard/seeker">Dashboard</a>
            <a href="/jobs/applied">Applied Jobs</a>
            <a href="/notifications">Notifications</a>
            <a href="/profile">Profile</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </div>

    <div class="container">

        <h2>Browse Jobs</h2>

        <div class="search-bar">

            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Search jobs">
                <div id="suggestions" class="suggestions"></div>
            </div>

            <input type="text" placeholder="Location" id="locationFilter">
               
            <button onclick="filterJobs()">Search</button>

        </div>

        <div id="jobList" class="job-list" aria-live="polite"></div>

    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        const MIN_MATCH_PERCENTAGE_TO_APPLY = {{ min_match_percentage|tojson }};
        let allJobs = [];
        function normalizeJobs(rawJobs) {
            if (!Array.isArray(rawJobs)) return [];
            return rawJobs.filter(job => {
                if (!job || typeof job !== 'object') return false;
                return Boolean(String(job.title || '').trim() || String(job.company || '').trim() || job._id);
            });
        }

        async function loadJobs() {
            const container = document.getElementById('jobList');
            container.setAttribute('aria-busy', 'true');
            container.setAttribute('role', 'status');
            container.textContent = 'Loading jobs...';

            try {
                const isJobSeeker = isLoggedIn() && getUser()?.role === 'jobseeker';
                const res = isJobSeeker
                    ? await fetchWithAuth('/jobs/recommended')
                    : await fetch(`${API_URL}/jobs`);
                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data && typeof data.error === 'string' ? data.error : 'Failed to load jobs.');
                }
                if (!Array.isArray(data)) throw new Error('The jobs response was invalid.');

                allJobs = normalizeJobs(data);
                container.removeAttribute('aria-busy');
                displayJobs(allJobs);
            } catch (error) {
                allJobs = [];
                container.removeAttribute('aria-busy');
                container.textContent = error.message || 'Unable to load jobs. Please try again later.';
            }
        }
        function displayJobs(jobs) {
            const container = document.getElementById('jobList');
            container.innerHTML = '';
            const validJobs = Array.isArray(jobs)
                ? jobs.filter(job => {
                    if (!job || typeof job !== 'object') return false;
                    const title = String(job.title || '').trim();
                    const company = String(job.company || '').trim();
                    const location = String(job.location || '').trim();
                    return title || company || location || job._id;
                })
                : [];

            if (!validJobs.length) {
                container.innerHTML = '<p>No matching jobs found.</p>';
                return;
            }

            validJobs.forEach(job => {
                const title = String(job.title || '');
                const company = String(job.company || '');
                const location = String(job.location || 'Location not specified');
                const description = String(job.description || '');
                const jobId = String(job._id || '');
                const hasValidJobId = /^[a-f\d]{24}$/i.test(jobId);
                const matchedSkills = Array.isArray(job.matchedSkills)
                    ? job.matchedSkills.map(String).join(', ')
                    : '';
                const missingSkills = Array.isArray(job.missingSkills)
                    ? job.missingSkills.map(String).join(', ')
                    : '';
                const isApplied = Boolean(job.alreadyApplied);
                const hasMatchPercentage = Number.isFinite(job.matchPercentage);
                const lowMatch = !isApplied && hasMatchPercentage && job.matchPercentage < MIN_MATCH_PERCENTAGE_TO_APPLY;
                const buttonText = isApplied
                    ? 'Applied'
                    : lowMatch
                        ? `Low Match (${job.matchPercentage}%)`
                        : 'Apply';
                const buttonDisabled = isApplied || lowMatch || !hasValidJobId ? 'disabled' : '';
                const buttonTitle = lowMatch ? `Match must be at least ${MIN_MATCH_PERCENTAGE_TO_APPLY}% to apply.` : '';
                const card = document.createElement('div');
                card.className = 'job-card';
                card.innerHTML = `
                    <div class="job-info">
                        <h4>${escapeHtml(title)}</h4>
                        <p>${escapeHtml(company)} &middot; ${escapeHtml(location)}</p>
                        <p>${description ? `${escapeHtml(description.substring(0, 100))}${description.length > 100 ? '...' : ''}` : 'No description provided.'}</p>
                        ${hasMatchPercentage ? `<p><strong>AI Match:</strong> ${job.matchPercentage}%</p>` : ''}
                        ${matchedSkills ? `<p><strong>Matched skills:</strong> ${escapeHtml(matchedSkills)}</p>` : ''}
                        ${missingSkills ? `<p><strong>Missing skills:</strong> ${escapeHtml(missingSkills)}</p>` : ''}
                        ${lowMatch ? `<p style="color: #fde68a;"><strong>Minimum ${MIN_MATCH_PERCENTAGE_TO_APPLY}% match required to apply.</strong></p>` : ''}
                    </div>
                    <button class="apply-btn" onclick="applyJob('${escapeHtml(jobId)}')" ${buttonDisabled} title="${buttonTitle}">
                        ${buttonText}
                    </button>
                `;
                container.appendChild(card);
            });
        }

        async function applyJob(jobId) {
            try {
                const res = await fetchWithAuth(`/jobs/${encodeURIComponent(jobId)}/apply`, { method: 'POST' });
                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || 'Unable to apply for this job.');
                }

                alert(data.message || 'Applied successfully!');
                await loadJobs();
            } catch (error) {
                alert(error.message || 'Unable to apply for this job.');
            }
        }

        function filterJobs() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const location = document.getElementById('locationFilter').value.toLowerCase();
            const filtered = allJobs.filter(job =>
                job && typeof job === 'object' &&
                (String(job.title || '').toLowerCase().includes(search) ||
                    String(job.description || '').toLowerCase().includes(search)) &&
                (location === '' || String(job.location || '').toLowerCase().includes(location))
            );
            displayJobs(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const suggestions = document.getElementById('suggestions');
            if (!query) {
                suggestions.style.display = 'none';
                return;
            }

            const filtered = allJobs.filter(job =>
                job && typeof job === 'object' && String(job.title || '').toLowerCase().includes(query)
            );
            suggestions.innerHTML = '';
            filtered.forEach(job => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = String(job.title || '');
                div.onclick = () => {
                    document.getElementById('searchInput').value = String(job.title || '');
                    suggestions.style.display = 'none';
                    filterJobs();
                };
                suggestions.appendChild(div);
            });
            suggestions.style.display = filtered.length ? 'block' : 'none';
        });

        loadJobs();
    </script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</body>

</html>
