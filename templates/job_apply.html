<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Jobs</title>

    <style>
        /* RESET */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        /* BODY */
        body {
            display: flex;
            height: 100vh;
            background: #1D0936;
            color: white;
        }

        /* SIDEBAR */
        .sidebar {
            width: 240px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.04);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar h2 {
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            margin: 10px 0;
            padding: 10px;
            border-radius: 8px;
            color: #cbd5f5;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: rgba(99, 102, 241, 0.2);
            color: white;
        }

        /* MAIN */
        .main {
            flex: 1;
            padding: 24px 40px;
            overflow-y: auto;
        }

        /* TOPBAR */
        .topbar {
            margin-bottom: 20px;
        }

        /* SECTION TITLE */
        h3 {
            margin: 25px 0 10px;
        }

        /* CONTAINERS */
        .container {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* CARD */
        .job-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .job-card:hover {
            transform: translateY(-3px);
        }

        /* INFO */
        .job-info h4 {
            margin-bottom: 5px;
        }

        .job-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        /* BUTTON */
        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            cursor: pointer;
        }

        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>AI JOB</h2>
        <a href="seeker_dashboard.html">Dashboard</a>
        <a href="browse_jobs.html">Browse Jobs</a>
        <a href="applied_jobs.html">Applied Jobs</a>
        <a href="login.html" id="logout">Logout</a>
    </div>

    <div class="main">

        <div class="topbar">
            <h2>Jobs</h2>
        </div>

        <!-- ✅ APPLIED JOBS -->
        <h3>Applied Jobs</h3>
        <div id="appliedContainer" class="container"></div>

        <!-- ✅ RECOMMENDED JOBS -->
        <h3>Recommended Jobs</h3>
        <div id="jobContainer" class="container"></div>

    </div>

    <script>
        const jobs = [
            {
                title: "Frontend Developer",
                company: "Google",
                location: "Bangalore",
                skills: ["html", "css", "javascript"]
            },
            {
                title: "Backend Developer",
                company: "Amazon",
                location: "Hyderabad",
                skills: ["python", "django", "sql"]
            }
        ];

        let appliedJobs = [];

        function displayJobs() {
            const jobContainer = document.getElementById("jobContainer");
            const appliedContainer = document.getElementById("appliedContainer");

            jobContainer.innerHTML = "";
            appliedContainer.innerHTML = "";

            jobs.forEach((job, index) => {

                const card = `
            <div class="job-info">
                <h4>${job.title} - ${job.company}</h4>
                <p>${job.location}</p>
                <p>Skills: ${job.skills.join(", ")}</p>
            </div>
        `;

                if (appliedJobs.includes(index)) {
                    appliedContainer.innerHTML += `
                <div class="job-card">
                    ${card}
                    <button class="btn" disabled>Applied</button>
                </div>
            `;
                } else {
                    jobContainer.innerHTML += `
                <div class="job-card">
                    ${card}
                    <button class="btn" onclick="applyJob(${index})">Apply</button>
                </div>
            `;
                }
            });
        }

        function applyJob(index) {
            if (!appliedJobs.includes(index)) {
                appliedJobs.push(index);
            }
            displayJobs();
        }

        window.onload = displayJobs;
    </script>

</body>

</html>
