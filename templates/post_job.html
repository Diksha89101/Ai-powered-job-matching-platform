<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Post a Job</title>
    <style>
        body {
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                transform: translateY(60px);
            }
            to {
                transform: translateY(0);
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="sidebar">
        <h2>AI HIRE</h2>
        <a href="/dashboard/recruiter">Home</a>
        <a href="/recruiter/profile">Profile</a>
        <a href="/recruiter/jobs/new">Post Job</a>
        <a href="/recruiter/jobs">Manage Jobs</a>
        <a href="/dashboard/recruiter/overview">Dashboard</a>
        <a href="#" onclick="logout()">Logout</a>
    </div>
    <div class="main-content">
        <h2>Post a New Job</h2>
        <form id="postJobForm" style="max-width:600px">
            <input type="text" id="title" placeholder="Job Title" required>
            <input type="text" id="company" placeholder="Company Name" required>
            <input type="text" id="location" placeholder="Location" required>
            <textarea id="description" placeholder="Job Description" rows="4" required></textarea>
            <input type="text" id="skills" placeholder="Required Skills (comma separated)" required>
            <button type="submit" class="btn">Post Job</button>
        </form>
    </div>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('postJobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const job = {
                title: document.getElementById('title').value,
                company: document.getElementById('company').value,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value,
                skills: document.getElementById('skills').value
            };
            
            const res = await fetchWithAuth('/jobs', { method: 'POST', body: JSON.stringify(job) });
            if (res.ok) {
                alert('Job posted!');
                window.location.href = '/recruiter/jobs';
            } else {
                const err = await res.json();
                alert(err.error);
            }
        });
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</body>
</html>
