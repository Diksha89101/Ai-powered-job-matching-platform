<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Job Platform</title>
    <style>
        body {
            min-height: 100vh;
            height: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            animation: slideUp 0.8s ease-out;
        }

        body {
            background: #1D0936;
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }

        .forgot-password-container {
            width: min(440px, 100%);
            padding: 32px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .forgot-password-container h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 26px;
            color: white;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5f5;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            height: 46px;
            padding: 0 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            outline: none;
        }

        .form-group input::placeholder {
            color: #94a3b8;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.18);
        }

        .btn-primary {
            width: 100%;
            height: 46px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        .btn-primary:hover {
            filter: brightness(1.08);
        }

        .btn-primary:disabled {
            background: #514d68;
            cursor: not-allowed;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 10px;
            display: none;
            overflow-wrap: anywhere;
            word-break: break-word;
            white-space: normal;
        }

        .message a {
            color: #a78bfa;
            text-decoration: underline;
            word-break: break-word;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.12);
            color: #bbf7d0;
            border: 1px solid rgba(34, 197, 94, 0.35);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.12);
            color: #fecaca;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .back-to-login {
            text-align: center;
            margin-top: 16px;
        }

        .back-to-login a {
            color: #6366f1;
            text-decoration: none;
            font-size: 14px;
        }

        .back-to-login a:hover {
            text-decoration: underline;
        }

        .help-text {
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
            margin: 0 0 20px;
        }
    </style>
    <style>
        @keyframes slideUp {
            from {
                transform: translateY(60px);
            }
            to {
                transform: translateY(0);
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>
    <div class="forgot-password-container">
        <h1>Forgot Password</h1>
        <p class="help-text">Enter your email address to reset your password.</p>
        
        <div id="message" class="message"></div>
        
        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email">
            </div>
            <button type="submit" class="btn-primary" id="submitBtn">Send Reset Link</button>
        </form>
        
        <div class="back-to-login">
            <a href="/login">Back to Login</a>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/app.js"></script>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            // Disable button and show loading
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email: email })
                });
                
                const data = await response.json();
                
                messageDiv.style.display = 'block';
                
                if (response.ok) {
                    messageDiv.className = 'message success';
                    messageDiv.style.whiteSpace = 'pre-wrap';
                    let msg = data.dev_link ? '🔗 <a href="' + data.dev_link + '" target="_blank" style="color: #007bff; text-decoration: underline;">Click here to reset your password</a>\n\nOr copy this link: ' + data.dev_link : (data.message || 'If an account exists with this email, a password reset link has been created.');
                    messageDiv.innerHTML = msg.replace(/\n/g, '<br>');
                    document.getElementById('forgotPasswordForm').style.display = 'none';
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = data.error || data.message || 'An error occurred. Please try again.';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Reset Link';
                }
            } catch (error) {
                messageDiv.style.display = 'block';
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Network error. Please check your connection and try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Reset Link';
            }
        });
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</body>
</html>
