<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Notifications</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #1D0936;
            color: white;
            padding: 40px;
        }

        /* CONTAINER */
        .card {
            max-width: 800px;
            margin: auto;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        h2 {
            margin-bottom: 20px;
        }

        .hero {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .hero img {
            width: 120px;
            height: auto;
            object-fit: contain;
        }

        .hero p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        /* INPUT */
        input,
        textarea {
            width: 100%;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        textarea {
            height: 100px;
        }

        /* APPLICANT ROW */
        .applicant-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .applicant-row:hover {
            background: rgba(99, 102, 241, 0.15);
        }

        /* INFO */
        .applicant-info {
            display: flex;
            flex-direction: column;
        }

        .name {
            font-weight: 600;
        }

        .job {
            font-size: 13px;
            color: #94a3b8;
        }

        /* CUSTOM CHECKBOX */
        .checkbox input {
            display: none;
        }

        .checkmark {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid #6366f1;
            display: inline-block;
            position: relative;
        }

        .checkbox input:checked+.checkmark {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            box-shadow: 0 0 10px #6366f1;
        }

        .checkmark::after {
            content: "";
            position: absolute;
            display: none;
        }

        .checkbox input:checked+.checkmark::after {
            display: block;
            left: 6px;
            top: 2px;
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* BUTTON */
        button {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            color: white;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
        }

        button:hover {
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="hero">
            <img src="{{ url_for('static', filename='images/recruiter.png') }}" alt="Recruiter illustration">
            <div>
                <h2>Send Notification to Applicants</h2>
                <p>Images inside Flask templates should be loaded from the static folder.</p>
            </div>
        </div>

        <input type="text" id="jobTitle" placeholder="Enter Job Title">

        <div id="applicantList"></div>

        <textarea id="message" placeholder="Write your message..."></textarea>

        <button onclick="sendNotification()">Send Notification</button>

    </div>

    <script>
       
        /* SAMPLE DATA */
        const applicants = [
            { name: "Diksha", email: "receiver_email@gmail.com", job: "Frontend Developer" },
            { name: "Rahul", email: "receiver_email@gmail.com", job: "Backend Developer" }
        ];

        /* LOAD APPLICANTS */
        function loadApplicants() {
            const list = document.getElementById("applicantList");

            applicants.forEach((app, i) => {
                const div = document.createElement("div");
                div.className = "applicant-row";

                div.innerHTML = `
            <div class="applicant-info">
                <span class="name">${app.name}</span>
                <span class="job">${app.job}</span>
            </div>

            <label class="checkbox">
                <input type="checkbox" value="${i}">
                <span class="checkmark"></span>
            </label>
        `;

                list.appendChild(div);
            });
        }

        /* SEND EMAIL */
        async function sendNotification() {
            const message = document.getElementById("message").value.trim();
            const job = document.getElementById("jobTitle").value.trim();

            if (!message || !job) {
                alert("Please fill all fields!");
                return;
            }

            const selected = document.querySelectorAll("input[type='checkbox']:checked");

            if (selected.length === 0) {
                alert("Select at least one applicant!");
                return;
            }

            for (let box of selected) {
                const app = applicants[box.value];
                await fetch("http://127.0.0.1:5000/send-email", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: app.email,
                        message: message,
                        job: job
                    })
                });
            }

            alert("Notifications sent!");
        }

        /* INIT */
        loadApplicants();

    </script>

</body>

</html>
